<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal E-Commerce</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #f4f4f5; color: #18181b; padding: 20px; }
    header { display: flex; justify-content: space-between; align-items: center; max-width: 1000px; margin: 0 auto 30px; }
    header h1 { font-size: 1.5rem; }
    .cart-btn { background: #18181b; color: #fff; border: 0; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; max-width: 1000px; margin: 0 auto; }
    .card { background: #fff; padding: 15px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); text-align: center; }
    .card img { width: 100%; height: 160px; object-fit: cover; border-radius: 6px; margin-bottom: 12px; }
    .card h3 { font-size: 1.1rem; margin-bottom: 6px; }
    .price { font-weight: bold; color: #16a34a; margin-bottom: 12px; }
    .add-btn { width: 100%; background: #2563eb; color: #fff; border: 0; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: 500; }
    .add-btn:hover { background: #1d4ed8; }
  </style>
</head>
<body>

  <header>
    <h1>ShopModern</h1>
    <button class="cart-btn">Cart (0)</button>
  </header>

  <main class="grid">
    <div class="card">
      <img src="https://via.placeholder.com/200" alt="Product">
      <h3>Wireless Headphones</h3>
      <p class="price">$99.00</p>
      <button class="add-btn">Add to Cart</button>
    </div>

    <div class="card">
      <img src="https://via.placeholder.com/200" alt="Product">
      <h3>Smart Watch</h3>
      <p class="price">$149.00</p>
      <button class="add-btn">Add to Cart</button>
    </div>

    <div class="card">
      <img src="https://via.placeholder.com/200" alt="Product">
      <h3>Minimal Backpack</h3>
      <p class="price">$59.00</p>
      <button class="add-btn">Add to Cart</button>
    </div>
  </main>

</body>
</html>
